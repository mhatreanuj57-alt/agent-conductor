[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-conductor"
version = "0.3.2"
description = "Run Codex CLI and OpenCode CLI simultaneously on isolated git worktrees - LLM task planner, parallel headless runners, auto-merge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anuj Mhatre" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "multi-agent", "codex", "opencode", "orchestrator", "llm", "git-worktree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.scripts]
agent-conductor = "agent_conductor.cli:main"

[project.urls]
Homepage = "https://github.com/a18-n03/agent-conductor"
Repository = "https://github.com/a18-n03/agent-conductor"

[tool.setuptools]
packages = ["agent_conductor"]
